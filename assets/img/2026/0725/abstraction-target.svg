<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="500" fill="#ffffff"/>

  <defs>
    <marker id="dependency-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#52697d"/>
    </marker>
    <marker id="agent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#2a6f9e"/>
    </marker>
  </defs>

  <text x="380" y="30" fill="#2f3740" font-size="17" font-weight="700" text-anchor="middle">ALPS Writer — 추상화 계층과 Agent</text>

  <!-- Clean Architecture-style target -->
  <circle cx="250" cy="245" r="185" fill="#eef3f8" stroke="#8da4b7" stroke-width="2"/>
  <circle cx="250" cy="245" r="125" fill="#fff1cc" stroke="#d0a53a" stroke-width="2"/>
  <circle cx="250" cy="245" r="70" fill="#dcefdc" stroke="#68a468" stroke-width="2"/>

  <!-- inward dependency -->
  <line x1="73" y1="245" x2="177" y2="245" stroke="#52697d" stroke-width="2" marker-end="url(#dependency-arrow)"/>
  <text x="124" y="226" fill="#52697d" font-size="10.5" text-anchor="middle">의존 방향</text>

  <!-- layer labels -->
  <text x="250" y="127" fill="#946e08" font-size="16" font-weight="700" text-anchor="middle">ADR</text>
  <text x="250" y="147" fill="#806318" font-size="11" text-anchor="middle">결정 · 근거 · 구현 계약</text>
  <text x="250" y="163" fill="#a08235" font-size="10.5" text-anchor="middle">가끔 바뀜</text>

  <text x="250" y="232" fill="#2f6b2f" font-size="16" font-weight="700" text-anchor="middle">ALPS PRD</text>
  <text x="250" y="253" fill="#477a47" font-size="10.5" text-anchor="middle">제품 의도 · 기능 계약</text>
  <text x="250" y="270" fill="#679067" font-size="10.5" text-anchor="middle">가장 오래 유지</text>

  <text x="250" y="374" fill="#41576a" font-size="16" font-weight="700" text-anchor="middle">코드와 테스트</text>
  <text x="250" y="395" fill="#596f81" font-size="10.5" text-anchor="middle">구조 · 이름 · 의존성 · 튜닝</text>
  <text x="250" y="412" fill="#758797" font-size="10.5" text-anchor="middle">가장 자주 바뀜</text>

  <!-- Agent stays outside the authority rings -->
  <rect x="500" y="112" width="235" height="264" rx="12" fill="#eaf2f8" stroke="#2a6f9e" stroke-width="1.8"/>
  <text x="617.5" y="145" fill="#1f5a80" font-size="18" font-weight="700" text-anchor="middle">Agent</text>
  <text x="617.5" y="168" fill="#336b8e" font-size="11.5" font-weight="600" text-anchor="middle">일시적 오케스트레이션</text>

  <text x="528" y="208" fill="#385f78" font-size="11">• 제품 의도와 계약을 읽고 분류</text>
  <text x="528" y="232" fill="#385f78" font-size="11">• 결정과 구현 계약 정리</text>
  <text x="528" y="256" fill="#385f78" font-size="11">• 탐색 · 구현 · 검증</text>

  <rect x="541" y="276" width="153" height="29" rx="14.5" fill="#ffffff" stroke="#91b4ca" stroke-width="1"/>
  <text x="617.5" y="295" fill="#2a6f9e" font-size="11" font-weight="600" text-anchor="middle">Skill · MCP · CLI</text>

  <line x1="523" y1="322" x2="712" y2="322" stroke="#b9cbd7" stroke-width="1"/>
  <text x="617.5" y="344" fill="#596f81" font-size="10.5" text-anchor="middle">네 번째 권위 계층이 아님</text>
  <text x="617.5" y="361" fill="#596f81" font-size="10.5" text-anchor="middle">실행 상태를 다음 작업에 남기지 않음</text>

  <!-- orchestration connections -->
  <path d="M500,202 C438,195 380,206 321,236" fill="none" stroke="#2a6f9e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#agent-arrow)"/>
  <path d="M500,234 C443,218 402,190 356,162" fill="none" stroke="#2a6f9e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#agent-arrow)"/>
  <path d="M500,266 C456,282 431,322 404,346" fill="none" stroke="#2a6f9e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#agent-arrow)"/>

  <text x="380" y="474" fill="#6a737d" font-size="11.5" text-anchor="middle">안쪽일수록 안정적이고, 바깥쪽일수록 자주 바뀐다. Agent는 모든 계층을 오가지만 어느 원도 소유하지 않는다.</text>
</svg>

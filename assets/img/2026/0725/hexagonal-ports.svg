<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>

  <defs>
    <marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#444"/>
    </marker>
    <marker id="port" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#8a6a10"/>
    </marker>
    <marker id="agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2a6f9e"/>
    </marker>
  </defs>

  <!-- hexagon: domain core -->
  <polygon points="238,92 322,142 322,242 238,292 154,242 154,142"
           fill="#cfe8cf" stroke="#6aa96a" stroke-width="1.8"/>
  <text x="238" y="172" fill="#2f6b2f" font-size="13.5" font-weight="600" text-anchor="middle">도메인</text>
  <text x="238" y="194" fill="#3f7a3f" font-size="11" text-anchor="middle">비즈니스 요구사항</text>
  <text x="238" y="211" fill="#3f7a3f" font-size="11" text-anchor="middle">= PRD의 가설</text>
  <text x="238" y="234" fill="#5f8f5f" font-size="10" text-anchor="middle">아무것도 참조하지 않는다</text>

  <!-- ports sitting on the hexagon edges -->
  <rect x="112" y="129" width="66" height="26" rx="4" fill="#fff3d6" stroke="#dcb95e" stroke-width="1.5"/>
  <text x="145" y="146" fill="#8a6a10" font-size="11" font-weight="600" text-anchor="middle">ADR</text>

  <rect x="298" y="229" width="66" height="26" rx="4" fill="#fff3d6" stroke="#dcb95e" stroke-width="1.5"/>
  <text x="331" y="246" fill="#8a6a10" font-size="11" font-weight="600" text-anchor="middle">ADR</text>

  <!-- port caption, fully outside the hexagon (left of the ADR port box) so it
       overlaps neither the polygon edge nor the forbidden path along the bottom -->
  <text x="106" y="184" fill="#8a6a10" font-size="10.5" text-anchor="end">포트 =</text>
  <text x="106" y="199" fill="#8a6a10" font-size="10.5" text-anchor="end">지켜야 할 요구사항과</text>
  <text x="106" y="214" fill="#8a6a10" font-size="10.5" text-anchor="end">판정 기준</text>
  <text x="106" y="236" fill="#a08a4a" font-size="10" text-anchor="end">계약만 있고 구현은 없다</text>

  <!-- application service: coding agent -->
  <rect x="452" y="104" width="286" height="112" rx="10" fill="#eaf2f8" stroke="#2a6f9e" stroke-width="1.6"/>
  <text x="595" y="132" fill="#1f5a80" font-size="13" font-weight="600" text-anchor="middle">애플리케이션 서비스</text>
  <text x="595" y="152" fill="#1f5a80" font-size="12" font-weight="600" text-anchor="middle">= 코딩 에이전트</text>
  <text x="595" y="175" fill="#33607d" font-size="10.5" text-anchor="middle">포트(ADR)를 구현하고,</text>
  <text x="595" y="192" fill="#33607d" font-size="10.5" text-anchor="middle">코드가 만족할 형태를 정한다</text>

  <!-- agent implements the inbound port -->
  <line x1="452" y1="138" x2="186" y2="142" stroke="#8a6a10" stroke-width="1.6" marker-end="url(#port)"/>
  <text x="320" y="86" fill="#8a6a10" font-size="10.5" text-anchor="middle">ADR을 읽고 그 계약을 구현한다</text>

  <!-- adapters: code -->
  <rect x="452" y="266" width="286" height="94" rx="10" fill="#f5f5f5" stroke="#c9c9c9" stroke-width="1.5"/>
  <text x="595" y="292" fill="#333" font-size="12.5" font-weight="600" text-anchor="middle">어댑터 = 코드 · 툴 · 테스트</text>
  <text x="595" y="314" fill="#777" font-size="10.5" text-anchor="middle">지금 어떻게 동작하나 · 매일 바뀜</text>
  <text x="595" y="335" fill="#777" font-size="10.5" text-anchor="middle">교체 가능하다</text>

  <!-- dependency inversion: the service defines what code must satisfy -->
  <line x1="595" y1="216" x2="595" y2="262" stroke="#444" stroke-width="1.8" marker-end="url(#solid)"/>
  <text x="607" y="244" fill="#555" font-size="10.5">만족할 형태를 정한다</text>

  <!-- agent reads current code to restore the mapping -->
  <line x1="452" y1="300" x2="372" y2="262" stroke="#2a6f9e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#agent)"/>
  <text x="402" y="300" fill="#2a6f9e" font-size="10" text-anchor="middle">코드를 읽어</text>
  <text x="402" y="314" fill="#2a6f9e" font-size="10" text-anchor="middle">매핑을 복원한다</text>

  <!-- forbidden back-reference: adapter must not point back at the domain.
       Routed along the bottom so it clearly connects the two boxes. -->
  <path d="M 470 372 L 238 372 L 238 300" fill="none" stroke="#c05a5a" stroke-width="1.6"
        stroke-dasharray="5 4" opacity="0.7"/>
  <line x1="224" y1="344" x2="252" y2="372" stroke="#c05a5a" stroke-width="2.2"/>
  <line x1="252" y1="344" x2="224" y2="372" stroke="#c05a5a" stroke-width="2.2"/>
  <text x="336" y="390" fill="#c05a5a" font-size="10.5" text-anchor="middle">코드가 문서를 역참조하지 않는다</text>

  <!-- footer notes -->
  <text x="452" y="396" fill="#666" font-size="10.5">코드는 ADR 번호를, ADR은 PRD를 인용하지 않는다.</text>
  <text x="452" y="413" fill="#666" font-size="10.5">추적은 git blame → 커밋 메시지가 대신한다.</text>
  <text x="452" y="437" fill="#999" font-size="10">헥사고날과 달리 이 방향을 검사할 컴파일러가 없어,</text>
  <text x="452" y="452" fill="#999" font-size="10">스크립트가 역참조를 검사한다.</text>
</svg>

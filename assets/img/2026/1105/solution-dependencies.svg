<title id="title">Software Factory — 업무 규칙을 보호하는 구현·검증</title><desc id="desc">Software Factory가 업무 흐름과 인터페이스, 외부 기술을 연결하는 어댑터를 구현한다. 코드 의존성은 바깥의 구현에서 안쪽의 업무 규칙으로 향한다.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="708" viewBox="0 0 640 708" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Abstraction layers centered on business processes</title>
<desc id="desc">Business processes and their ontology sit at the center, surrounded by feature contracts and ADRs, then code and tests. Lower-level implementation depends on higher-level business criteria. Business changes propagate to contracts and code; implementation changes preserve the business model.</desc>
<defs><marker id="inward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#336fa1"/></marker></defs>

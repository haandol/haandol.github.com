<text x="320" y="362" text-anchor="middle" font-size="15" font-weight="400" fill="#285d3b">Context Layer Solution</text>
<text x="320" y="613" text-anchor="middle" font-size="18" font-weight="700" fill="#336fa1">Dependencies: code → ADRs → business processes</text>

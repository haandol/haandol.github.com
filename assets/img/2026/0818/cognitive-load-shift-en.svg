  <text x="20" y="104" fill="#4b5563" font-size="14" font-weight="700">Traditional</text>
  <text x="20" y="124" fill="#777" font-size="11">Spread through build</text>

  <text x="20" y="256" fill="#3355cc" font-size="14" font-weight="700">AI-assisted</text>
  <text x="20" y="276" fill="#777" font-size="11">Focused at the ends</text>

  <text x="119" y="72" fill="#999" font-size="10" text-anchor="end">High</text>
  <text x="119" y="173" fill="#999" font-size="10" text-anchor="end">Low</text>
  <text x="119" y="224" fill="#999" font-size="10" text-anchor="end">High</text>
  <text x="119" y="325" fill="#999" font-size="10" text-anchor="end">Low</text>

  <text x="403" y="143" fill="#596273" font-size="11" text-anchor="middle">Reading, deciding, coding, and testing continue</text>
  <text x="398" y="304" fill="#596273" font-size="11" text-anchor="middle">Human load drops while the agent codes</text>

  <text x="198" y="352" fill="#4f5faf" font-size="12" font-weight="700" text-anchor="middle">Intent &amp; constraints</text>

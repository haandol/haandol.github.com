  <text x="604" y="352" fill="#a06c00" font-size="12" font-weight="700" text-anchor="middle">Review &amp; approval</text>

  <line x1="128" y1="374" x2="680" y2="374" stroke="#888" stroke-width="1.2"/>
  <path d="M680,374 L672,370 L672,378 Z" fill="#888"/>

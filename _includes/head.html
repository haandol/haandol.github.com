<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3295710964516883"
     crossorigin="anonymous"></script>
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QSKY09QH6Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-QSKY09QH6Z');
  </script>
  <link href="http://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices. maximum-scale은 확대를 막아
       접근성을 해치므로 두지 않는다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">

  <title>
  {% if page.title == "Home" %}
    {{ site.title }}, {{ site.tagline }}
  {% else %}
    {{ page.title }} ({{ page.excerpt }}), {{ site.title }}
  {% endif %}
  </title>

  <!-- meta data -->
{% if page.title == "Home" %}
  <meta name="title" content="{{ site.title }}">
  <meta name="description" content="{{ site.tagline }}">
  <meta name="keywords" content="Python, Javascript, Typescript, Machine Learning, Software Development, Backend, Algorithm">
{% else %}
  <meta name="title" content="{{ page.title }}">
  <meta name="description" content="{{ page.excerpt }}">
  <meta name="keywords" content="{{ page.tags | join:' ' }}">
{% endif %}
  <meta name="author" content="haandol">

  <!-- 테마와 사이드바 상태 복원 — 페인트 전에 실행해야 깜빡임이 없다.
       저장된 값이 없으면 OS 설정을 따른다. -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem('theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.setAttribute('data-theme', theme);
        if (localStorage.getItem('sidebarHidden') === '1') {
          root.classList.add('sidebar-hidden');
        }
      } catch (e) {
        root.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Fonts — Pretendard는 한글 글리프를 갖춘 본문 서체, JetBrains Mono는
       날짜·태그·코드용 유틸리티 서체다. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- CSS — tokens.css가 먼저 와야 나머지 스타일시트의 var() 참조가 해석된다 -->
  <link rel="stylesheet" href="/public/css/tokens.css">
  <link rel="stylesheet" href="/public/css/base.css">
  <link rel="stylesheet" href="/public/css/layout.css">
  <link rel="stylesheet" href="/public/css/syntax.css">
  <link rel="stylesheet" href="/public/css/components.css">
  <link rel="stylesheet" href="/public/css/keys.css">

  <!-- Icons -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="/public/apple-touch-icon-144-precomposed.png">
  <link rel="shortcut icon" href="/public/favicon.ico">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/atom.xml">

  <!-- Mermaid — 다이어그램은 흰 패널에 얹으므로 테마와 무관하게 default를 쓴다.
       원본 텍스트를 남겨둬야 나중에 다시 렌더할 수 있다. -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('pre > code.language-mermaid').forEach((el) => {
        const pre = el.parentElement;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = el.textContent;
        pre.replaceWith(div);
      });
      mermaid.run();
    });
  </script>
</head>
